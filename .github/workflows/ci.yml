name: CI

#
# The verification gate of the project.
#
# It runs on its own for every branch and pull request, and is called by
# 'publish.yml' before anything reaches the Marketplace, so that both paths
# check the very same things.
#

on:
  push:
    branches-ignore:
      # 'publish.yml' calls this workflow before publishing, so master would
      # otherwise be verified twice for the same commit
      - master
  pull_request:
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # the editor, that the integration tests are run in, is downloaded once
      # and kept between runs
      - uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: vscode-test-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      # the integration tests start a real editor, which needs a display
      - name: Integration tests
        run: xvfb-run -a npm test
