name: Publish

on:
  push:
    branches:
      - master

jobs:
  # nothing reaches the Marketplace, that does not pass the same gate every
  # other branch has to pass
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: npm
      # 'npm ci' installs exactly what the lock file says, unlike 'npm install'
      - run: npm ci
      - run: npm run build
      - run: npm run publish
        env:
            VSCE_TOKEN: ${{secrets.VSCE_TOKEN}}
